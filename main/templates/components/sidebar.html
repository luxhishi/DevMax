<div class="space-y-5">
  <div class="landing-panel p-2">
    <div class="space-y-1">
      <a href="{% url 'main:index' %}" class="nav-chip-active flex items-center gap-3 rounded-md px-3 py-2 text-xs font-semibold hover:bg-purple-700">
        <span>Home</span>
      </a>
      <a href="{% url 'main:trending' %}" class="flex items-center gap-3 rounded-md px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-100">
        <span>Popular</span>
      </a>
    </div>
  </div>

  <div class="landing-panel p-3">
    <div class="pb-2">
      <h4 class="text-[11px] font-semibold text-gray-500">Joined Subthreads</h4>
    </div>
    <div class="space-y-1">
      {% for sub in joined_subthreads %}
        <a href="{% url 'main:subthread_detail' sub.name %}" class="flex items-center justify-between rounded-md px-2 py-1.5 text-xs text-gray-700 hover:bg-gray-100">
          <span class="font-medium">d/{{ sub.name }}</span>
          <span class="text-[10px] text-gray-400">{{ sub.members }}</span>
        </a>
      {% empty %}
        <p class="px-2 py-1 text-xs text-gray-500">No joined subthreads yet.</p>
      {% endfor %}
    </div>
  </div>
</div>
