<div class="space-y-4">

  <!-- Navigation -->
  <div class="bg-white p-3 rounded-lg space-y-1">
    <a href="/" class="block px-3 py-2 bg-purple-600 text-white rounded text-sm hover:bg-purple-700">
      Home
    </a>
    <a href="/trending" class="block px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded">
      Trending
    </a>
  </div>

  <!-- Joined Subthreads -->
  <div class="bg-white p-3 rounded-lg space-y-1">
    <h4 class="text-sm font-semibold mb-2">Joined Subthreads</h4>
    {% for sub in joined_subthreads %}
      <a href="/d/{{ sub.name }}" class="block text-sm text-gray-700 hover:bg-gray-100 px-2 py-1 rounded">
        d/{{ sub.name }}
      </a>
    {% endfor %}
  </div>

</div>
