{% with active_nav=current_nav|default:"home" %}
<div class="space-y-4">
  <div class="bg-white p-3 rounded-lg space-y-1">
    <a href="{% url 'main:index' %}" class="block px-3 py-2 rounded text-sm {% if active_nav == 'home' %}bg-purple-600 text-white hover:bg-purple-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
      Home
    </a>
    <a href="{% url 'main:trending' %}" class="block px-3 py-2 rounded text-sm {% if active_nav == 'trending' %}bg-purple-600 text-white hover:bg-purple-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
      Trending
    </a>
    <a href="{% url 'main:questions' %}" class="block px-3 py-2 rounded text-sm {% if active_nav == 'questions' %}bg-purple-600 text-white hover:bg-purple-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
      Questions
    </a>
    {% if user.is_superuser %}
    <a href="{% url 'main:superuser_dashboard' %}" class="block px-3 py-2 rounded text-sm {% if active_nav == 'superuser_dashboard' %}bg-purple-600 text-white hover:bg-purple-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
      Moderation
    </a>
    {% endif %}
  </div>

  <div class="bg-white p-3 rounded-lg space-y-1">
    <h4 class="text-sm font-semibold mb-2">Joined Subthreads</h4>
    {% for sub in joined_subthreads %}
      <a href="{% url 'main:subthread_detail' sub.name %}" class="block text-sm text-gray-700 hover:bg-gray-100 px-2 py-1 rounded">
        d/{{ sub.name }}
      </a>
    {% empty %}
      <p class="text-sm text-gray-500 px-2 py-1">No joined subthreads yet.</p>
    {% endfor %}
  </div>
</div>
{% endwith %}
