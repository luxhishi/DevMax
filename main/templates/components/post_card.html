<div
  class="feed-card compact-feed-card overflow-hidden cursor-pointer"
  role="link"
  tabindex="0"
  onclick="window.location.href='{{ post.detail_url }}'"
  onkeydown="if (event.key === 'Enter') window.location.href='{{ post.detail_url }}'"
>
  <div class="flex">
    <div class="vote-rail flex w-10 shrink-0 flex-col items-center py-4 text-gray-500">
      <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 15l6-6 6 6"/>
      </svg>
      <span class="mt-1.5 text-[11px] font-semibold text-gray-700 leading-none">{{ post.upvotes }}</span>
      <svg class="mt-1.5 h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9l-6 6-6-6"/>
      </svg>
    </div>

    <div class="min-w-0 flex-1 p-3.5">
      <div class="flex flex-wrap items-center gap-2 text-[11px] text-gray-500">
        <span class="font-semibold text-purple-600">d/{{ post.subthread }}</span>
        <span>&bull;</span>
        <span>u/{{ post.author }}</span>
        <span>&bull;</span>
        <span>{{ post.timeAgo }}</span>
      </div>

      <h2 class="mt-2 text-base font-semibold leading-snug text-gray-900 sm:text-[1.05rem]">{{ post.title }}</h2>

      <p class="mt-1.5 text-xs leading-5 text-gray-700 sm:text-[13px]">{{ post.content }}</p>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        {% for tag in post.tags %}
          <span class="soft-chip rounded-full px-2.5 py-1 text-[10px] font-semibold leading-none">
            {{ tag }}
          </span>
        {% endfor %}
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-4 text-[11px] text-gray-500">
        <a href="{{ post.comments_url }}" class="inline-flex items-center gap-1 hover:text-gray-900" onclick="event.stopPropagation()">
          <span class="font-medium">{{ post.comments }}</span>
          <span>Comments</span>
        </a>
        <button type="button" class="inline-flex items-center gap-1 hover:text-gray-900" onclick="event.stopPropagation()">
          Share
        </button>
      </div>
    </div>
  </div>
</div>
