<div
  class="bg-white p-4 rounded-lg shadow space-y-2 cursor-pointer hover:bg-gray-50"
  role="link"
  tabindex="0"
  onclick="window.location.href='{% url 'post_detail' post_id=post.id %}'"
  onkeydown="if (event.key === 'Enter') window.location.href='{% url 'post_detail' post_id=post.id %}'"
>
  <div class="flex justify-between text-gray-500 text-sm">
    <span>d/{{ post.subthread }} • {{ post.timeAgo }}</span>
    <span>👍 {{ post.upvotes }} • 💬 {{ post.comments }}</span>
  </div>

  <h2 class="text-lg font-semibold">{{ post.title }}</h2>

  <p class="text-gray-700">{{ post.content }}</p>

  <div class="flex flex-wrap gap-2 mt-2">
    {% for tag in post.tags %}
      <span class="bg-gray-200 px-2 py-1 text-xs rounded">
        {{ tag }}
      </span>
    {% endfor %}
  </div>

  <div class="flex gap-4 text-gray-500 text-sm mt-2">
    <a href="{% url 'post_detail' post_id=post.id %}#comments" class="hover:underline" onclick="event.stopPropagation()">Comments</a>
    <button type="button" class="hover:underline" onclick="event.stopPropagation()">Share</button>
  </div>
</div>
