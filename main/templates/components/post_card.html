<div
  class="bg-white rounded-xl shadow cursor-pointer hover:bg-gray-50 transition-colors"
  role="link"
  tabindex="0"
  onclick="window.location.href='{{ post.detail_url }}'"
  onkeydown="if (event.key === 'Enter') window.location.href='{{ post.detail_url }}'"
>
  <div class="flex gap-4 p-4">
    <div class="w-12 shrink-0 flex flex-col items-center text-gray-500 pt-1">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 15l6-6 6 6"/>
      </svg>
      <span class="mt-2 text-base font-semibold text-gray-700 leading-none">{{ post.upvotes }}</span>
      <svg class="mt-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9l-6 6-6-6"/>
      </svg>
    </div>

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-2 text-sm text-gray-500">
        <span class="font-semibold text-purple-600">d/{{ post.subthread }}</span>
        <span>•</span>
        <span>Posted by u/{{ post.author }}</span>
        <span>•</span>
        <span>{{ post.timeAgo }}</span>
      </div>

      <h2 class="mt-3 text-2xl font-semibold text-gray-900 leading-snug">{{ post.title }}</h2>

      <p class="mt-2 text-gray-700 leading-relaxed">{{ post.content }}</p>

      <div class="mt-4 flex flex-wrap gap-2">
        {% for tag in post.tags %}
          <span class="bg-gray-200 px-3 py-1 text-xs font-semibold rounded-full">
            {{ tag }}
          </span>
        {% endfor %}
      </div>

      <div class="mt-6 flex items-center gap-6 text-sm text-gray-500">
        <a href="{{ post.comments_url }}" class="hover:underline" onclick="event.stopPropagation()">
          {{ post.comments }} Comments
        </a>
        <button type="button" class="hover:underline" onclick="event.stopPropagation()">
          Share
        </button>
      </div>
    </div>
  </div>
</div>
