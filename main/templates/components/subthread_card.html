{% load humanize %}
<div class="border p-3 rounded-lg bg-white flex flex-col justify-between">
  <div>
    <a href="{% url 'main:subthread_detail' sub.name %}" class="font-semibold text-sm hover:underline">d/{{ sub.name }}</a>
    <p class="text-xs text-gray-500">{{ sub.description }}</p>
    <p class="text-xs text-gray-400 mt-1">{{ sub.members|intcomma }} members</p>
  </div>
  <div class="mt-2">
    {% if user.is_authenticated %}
      {% if sub.name in joined_subthread_names %}
        <a href="{% url 'main:subthread_detail' sub.name %}" class="inline-flex items-center rounded border border-gray-300 bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-700 transition hover:bg-gray-200">
          Joined
        </a>
      {% else %}
        <form method="post" action="{% url 'main:join_subthread' sub.name %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button type="submit" class="launch-cta-button inline-flex bg-purple-600 text-white px-3 py-1 text-xs rounded hover:bg-purple-700">
            Join
          </button>
        </form>
      {% endif %}
    {% else %}
      <a href="{% url 'main:subthread_detail' sub.name %}" class="inline-flex items-center rounded border border-gray-300 bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-700 transition hover:bg-gray-200">
        View
      </a>
    {% endif %}
  </div>
</div>
