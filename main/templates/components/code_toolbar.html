<div class="compose-toolbar">
  <div class="compose-tool-group">
    <button
      type="button"
      class="compose-tool"
      data-code-insert="inline"
      data-target="{{ target_id }}"
      aria-label="Insert inline code"
      title="Inline code"
    >
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>
      </svg>
    </button>
    <button
      type="button"
      class="compose-tool"
      data-code-insert="block"
      data-target="{{ target_id }}"
      aria-label="Insert code block"
      title="Code block"
    >
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
  </div>
  <p class="compose-toolbar-note">Add inline code or a multi-line code block.</p>
</div>
