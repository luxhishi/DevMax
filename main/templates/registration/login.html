{% extends "base.html" %}
{% load static tailwind_tags %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">

    <!-- HEADER -->
    <div>
      <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-purple-100">
        <svg class="h-6 w-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>

      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Sign in to your account
      </h2>
      <p class="mt-3 text-center text-sm text-gray-600">
        New to DevMax?
        <a href="{% url 'main:signup' %}" class="font-semibold text-purple-600 hover:text-purple-500 hover:underline">
          Sign up here
        </a>
      </p>
    </div>

    <!-- FORM -->
    <form method="post" class="mt-8 space-y-6">
      {% csrf_token %}

      <div class="space-y-4">

        <!-- USERNAME -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5.121 17.804A9 9 0 1118.364 4.56M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>

          <input id="username" name="username" type="text" required
            class="w-full h-10 pl-10 pr-3 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
            placeholder="Username">
        </div>

        <!-- PASSWORD -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>

          <input id="password" name="password" type="password" required
            class="w-full h-10 pl-10 pr-10 border border-gray-300 rounded-lg
                   focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
            placeholder="Password">

          <button type="button"
            onclick="togglePassword('password')"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">

            <svg id="password-icon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>

      </div>

      <!-- ERROR -->
      {% if error %}
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
        {{ error }}
      </div>
      {% endif %}

      <!-- BUTTON -->
      <button type="submit"
        class="w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500">
        Sign in
      </button>
    </form>
  </div>
</div>

<!-- SCRIPT -->
<script>
function togglePassword(fieldId) {
  const field = document.getElementById(fieldId);
  const icon = document.getElementById(fieldId + '-icon');

  if (field.type === 'password') {
    field.type = 'text';
    icon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 3l18 18"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M10.584 10.587A3 3 0 0013.414 13.414M9.88 9.88l4.24 4.24"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M6.1 6.1C4.32 7.36 3.06 9.48 2.46 12c1.27 4.06 5.06 7 9.54 7 1.61 0 3.13-.38 4.46-1.05"/>
    `;
  } else {
    field.type = 'password';
    icon.innerHTML = `
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
    `;
  }
}
</script>

{% endblock %}
